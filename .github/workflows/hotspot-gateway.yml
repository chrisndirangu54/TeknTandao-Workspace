name: Hotspot Gateway Policy Tests
on:
  push:
    paths:
      - 'functions/src/hotspot_*'
      - 'infrastructure/hotspot-radius/**'
      - 'functions/test/hotspot_*'
      - '.github/workflows/hotspot-gateway.yml'
  pull_request:
    paths:
      - 'functions/src/hotspot_*'
      - 'functions/test/hotspot_*'
      - '.github/workflows/hotspot-gateway.yml'
  workflow_dispatch:
jobs:
  hotspot-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - run: node --check functions/src/hotspot_gateway_policy.js
      - run: node --check functions/src/hotspot_management.js
      - run: node --check functions/src/hotspot_pilot.js
      - run: node --check functions/src/hotspot_accounting.js
      - run: node --check functions/src/hotspot_domain.js
      - run: node --check functions/src/hotspot_payment_domain.js
      - run: node --check functions/src/hotspot_payment_intents.js
      - run: node --check functions/src/hotspot_v2.js
      - run: node --check functions/src/hotspot_v2_domain.js
      - run: node --check functions/src/hotspot_lifecycle_domain.js
      - run: node --check functions/src/hotspot_v2_operations.js
      - run: node --check functions/src/hotspot_v2_mpesa.js
      - run: node --check functions/src/hotspot_v2_health.js
      - run: node --check functions/src/hotspot_settlement_domain.js
      - run: node --check functions/src/hotspot_radius_authorization_domain.js
      - run: node --check functions/src/hotspot_v2_mpesa_callback.js
      - run: node --check functions/src/hotspot_v2_radius_endpoint.js
      - run: node --check functions/src/hotspot_gateway_approvals.js
      - run: node --check infrastructure/hotspot-radius/bridge.mjs
      - run: node --test functions/test/hotspot_domain.test.js functions/test/hotspot_gateway_policy.test.js functions/test/hotspot_payment_domain.test.js functions/test/hotspot_v2_domain.test.js functions/test/hotspot_lifecycle_domain.test.js functions/test/hotspot_settlement_domain.test.js functions/test/hotspot_radius_authorization_domain.test.js
