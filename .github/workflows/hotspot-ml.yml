name: Hotspot ML reproducibility
on:
  push:
    paths:
      - 'analytics/hotspot/**'
      - '.github/workflows/hotspot-ml.yml'
  pull_request:
    paths:
      - 'analytics/hotspot/**'
      - '.github/workflows/hotspot-ml.yml'
  workflow_dispatch:
jobs:
  ml-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: analytics/hotspot/requirements.txt
      - run: python -m pip install -r analytics/hotspot/requirements.txt
      - run: python -m unittest discover -s analytics/hotspot -p 'test_*.py' -v
