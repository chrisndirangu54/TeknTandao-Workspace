name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm --prefix functions ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm --prefix functions audit --audit-level=high
      - run: mkdir -p security-artifacts
      - run: npm sbom --sbom-format cyclonedx > security-artifacts/root-sbom.cdx.json
      - run: npm --prefix functions sbom --sbom-format cyclonedx > security-artifacts/functions-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: security-artifacts/
