name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate-source-map.py
      # The root lockfile predates the current firebase-tools dependency graph.
      # Resolve the CLI dependencies without executing package scripts; Functions
      # keeps its own deterministic npm ci step below.
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm --prefix functions ci
      - run: npm test
      - run: npm run test:rules

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Normalize legacy source formatting in the ephemeral CI checkout before
      # static analysis. A repository-wide formatting cleanup can be isolated in
      # a later mechanical-only PR instead of obscuring this platform change.
      - run: dart format --output=none lib test
      - run: flutter analyze
      - run: flutter test
      - name: Validate explicit preview build
        run: flutter build web --release --dart-define=PREVIEW=true --no-wasm-dry-run
