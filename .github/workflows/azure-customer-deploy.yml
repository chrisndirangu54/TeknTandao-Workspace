name: Azure customer deployment (manual, approved)
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Customer-approved resource name (3-24 lowercase letters/numbers/hyphens)'
        required: true
      resource_group:
        description: 'Preapproved customer resource group'
        required: true
      container_image:
        description: 'Approved container image (immutable digest recommended)'
        required: true
      approval_ticket:
        description: 'External customer approval ticket / change record'
        required: true
permissions:
  id-token: write
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check required authorization and naming
        env:
          APP_NAME: ${{ inputs.app_name }}
          APPROVAL_TICKET: ${{ inputs.approval_ticket }}
          IMAGE: ${{ inputs.container_image }}
        run: |
          [[ "$APP_NAME" =~ ^[a-z][a-z0-9-]{2,23}$ ]] || exit 1
          [[ "${#APPROVAL_TICKET}" -ge 8 ]] || exit 1
          [[ "$IMAGE" != *[[:space:]]* && -n "$IMAGE" ]] || exit 1
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: azure-production-customer-approval
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Review IaC changes before applying
        env:
          GROUP: ${{ inputs.resource_group }}
          APP: ${{ inputs.app_name }}
          IMAGE: ${{ inputs.container_image }}
        run: |
          az deployment group what-if --resource-group "$GROUP" --template-file infra/azure/container-app.bicep --parameters appName="$APP" image="$IMAGE"
      - name: Provision approved infrastructure
        env:
          GROUP: ${{ inputs.resource_group }}
          APP: ${{ inputs.app_name }}
          IMAGE: ${{ inputs.container_image }}
        run: |
          az deployment group create --resource-group "$GROUP" --template-file infra/azure/container-app.bicep --parameters appName="$APP" image="$IMAGE"
