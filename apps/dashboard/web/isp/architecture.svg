<rect x="110" y="852" width="390" height="49" rx="11" class="card"/><text x="305" y="873" class="bold body" text-anchor="middle">AI analysis · Alerts · Fault correlation</text><text x="305" y="890" class="tiny" text-anchor="middle">Advisory only until tested</text>
<rect x="520" y="852" width="332" height="49" rx="11" class="card"/><text x="686" y="875" class="bold body" text-anchor="middle">Customer / technician apps</text>
<rect x="875" y="852" width="390" height="49" rx="11" class="card"/><text x="1070" y="875" class="bold body" text-anchor="middle">Secure ISP admin console</text>
