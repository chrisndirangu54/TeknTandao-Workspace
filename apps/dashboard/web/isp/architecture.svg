<path class="line" d="M930 227 V264 H374 V329"/><path class="line" d="M1050 227 V264 H1015 V329"/>
<rect x="175" y="332" width="405" height="55" rx="12" class="card"/><text x="377" y="355" class="heading" text-anchor="middle">VSOL 4-port GPON OLT</text><text x="377" y="374" class="small" text-anchor="middle">Two PON interfaces allocated to pilot</text>
<path class="line" d="M377 387 V407 H230 V436"/><path class="line" d="M377 407 H531 V436"/>
<rect x="130" y="438" width="205" height="57" rx="11" class="card"/><text x="232" y="462" class="bold body" text-anchor="middle">PON 1 → 1:16 splitter</text><text x="232" y="483" class="small" text-anchor="middle">16 ONTs / homes</text>
<rect x="430" y="438" width="205" height="57" rx="11" class="card"/><text x="532" y="462" class="bold body" text-anchor="middle">PON 2 → 1:16 splitter</text><text x="532" y="483" class="small" text-anchor="middle">16 ONTs / homes</text>
<rect x="180" y="522" width="380" height="65" rx="12" class="orange"/><text x="370" y="548" class="heading" text-anchor="middle">32 managed GPON ONTs</text><text x="370" y="571" class="small" text-anchor="middle">OMCI / TR-069 subject to interoperability test</text><path class="line" d="M232 495 V511 H300 V518"/><path class="line" d="M532 495 V511 H450 V518"/>
<rect x="777" y="335" width="234" height="62" rx="12" class="orange"/><text x="894" y="362" class="bold body" text-anchor="middle">COMFAST bridge pair A</text><text x="894" y="382" class="small" text-anchor="middle">Link / VLAN testing required</text>
<rect x="1041" y="335" width="234" height="62" rx="12" class="orange"/><text x="1158" y="362" class="bold body" text-anchor="middle">COMFAST bridge pair B</text><text x="1158" y="382" class="small" text-anchor="middle">Link / VLAN testing required</text>
<path class="line" d="M894 397 V429"/><path class="line" d="M1158 397 V429"/>
<rect x="772" y="434" width="244" height="148" rx="12" class="card"/><text x="894" y="461" class="heading" text-anchor="middle">Remote building A</text><text x="894" y="487" class="small" text-anchor="middle">Managed Ethernet switch</text><path class="line" d="M894 495 V512"/><text x="894" y="539" class="bold body" text-anchor="middle">9 customer CPEs</text><text x="894" y="559" class="small" text-anchor="middle">Individual subscriber isolation</text>
<rect x="1036" y="434" width="244" height="148" rx="12" class="card"/><text x="1158" y="461" class="heading" text-anchor="middle">Remote building B</text><text x="1158" y="487" class="small" text-anchor="middle">Managed Ethernet switch</text><path class="line" d="M1158 495 V512"/><text x="1158" y="539" class="bold body" text-anchor="middle">9 customer CPEs</text><text x="1158" y="559" class="small" text-anchor="middle">Individual subscriber isolation</text>
<rect x="70" y="637" width="1260" height="146" rx="18" class="purple"/><text x="92" y="670" class="section">04 · TeknTandao Control &amp; Intelligence Platform</text>
<g><rect x="110" y="695" width="178" height="63" rx="11" class="card"/><text x="199" y="721" class="bold body" text-anchor="middle">Monitoring</text><text x="199" y="741" class="small" text-anchor="middle">Zabbix / Grafana</text>
<rect x="305" y="695" width="180" height="63" rx="11" class="card"/><text x="395" y="721" class="bold body" text-anchor="middle">RADIUS / PPPoE</text><text x="395" y="741" class="small" text-anchor="middle">Provisioning queue</text>
<rect x="502" y="695" width="180" height="63" rx="11" class="card"/><text x="592" y="721" class="bold body" text-anchor="middle">GenieACS</text><text x="592" y="741" class="small" text-anchor="middle">TR-069 devices</text>
<rect x="699" y="695" width="180" height="63" rx="11" class="card"/><text x="789" y="721" class="bold body" text-anchor="middle">M-Pesa / Billing</text><text x="789" y="741" class="small" text-anchor="middle">After integration</text>
<rect x="896" y="695" width="180" height="63" rx="11" class="card"/><text x="986" y="721" class="bold body" text-anchor="middle">CRM / Work orders</text><text x="986" y="741" class="small" text-anchor="middle">Admin workflows</text>
<rect x="1093" y="695" width="194" height="63" rx="11" class="card"/><text x="1190" y="721" class="bold body" text-anchor="middle">Audit / Notifications</text><text x="1190" y="741" class="small" text-anchor="middle">Access-controlled</text></g>
<path class="dash" d="M200 695 V623 H210 V590"/><path class="dash" d="M592 695 V610 H532 V590"/><path class="dash" d="M1190 695 V623 H1158 V590"/>
