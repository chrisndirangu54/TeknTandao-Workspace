<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 780" role="img" aria-labelledby="t d">
<title id="t">TeknTandao hybrid ISP topology</title><desc id="d">Upstream internet connects to the MikroTik core router and to two parallel access networks: GPON fiber through an OLT and splitters to 32 assumed households, and two point-to-point COMFAST bridge pairs serving nine customer routers per remote building. A separate ISP control platform manages monitoring, subscriber records, billing design and AI analysis.</desc>
<defs><style>text{font-family:Inter,Arial,sans-serif;fill:#14263d}.label{font-size:17px;font-weight:700}.small{font-size:13px;fill:#475569}.tiny{font-size:11px;fill:#475569}.heading{font-size:21px;font-weight:750}.line{stroke:#386eac;stroke-width:3;fill:none}.dash{stroke:#8b5cf6;stroke-width:2.5;stroke-dasharray:7 6;fill:none}.box{fill:#fff;stroke:#d9e4ef;stroke-width:2;rx:13}.fiber{fill:#edf7ff;stroke:#80b7e5;stroke-width:2;rx:14}.wireless{fill:#eaf9f1;stroke:#80d5a1;stroke-width:2;rx:14}.control{fill:#f5f0ff;stroke:#b4a0f0;stroke-width:2;rx:14}.assume{fill:#fff1d6;stroke:#e5ac43;stroke-width:1;rx:5}.v{fill:#dbf7e7;stroke:#69c892;stroke-width:1;rx:5}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#386eac" stroke-width="1.5"/></marker></defs>
<rect width="1180" height="780" rx="24" fill="#f8fafc"/><text x="590" y="39" text-anchor="middle" class="heading">HYBRID ISP TOPOLOGY · 50-SUBSCRIBER PILOT</text>
<rect x="410" y="60" width="360" height="53" class="box"/><text x="590" y="84" text-anchor="middle" class="label">☁ Upstream internet / transit</text><text x="590" y="102" text-anchor="middle" class="small">200 Mbps initial capacity (assumption)</text>
<path class="line" marker-end="url(#arrow)" d="M590 113V145"/><rect x="390" y="148" width="400" height="62" class="box"/><text x="590" y="173" text-anchor="middle" class="label">MikroTik RB5009 core</text><text x="590" y="193" text-anchor="middle" class="small">PPPoE · Firewall · VLANs · RADIUS · QoS</text>
<path class="line" d="M590 210V242H279V277M590 242H901V277" marker-end="url(#arrow)"/>
<rect x="35" y="270" width="494" height="299" class="fiber"/><text x="282" y="299" text-anchor="middle" class="heading">FIBER ACCESS (GPON)</text>
<rect x="151" y="315" width="259" height="49" class="box"/><text x="281" y="344" text-anchor="middle" class="label">VSOL 4-port GPON OLT</text>
<path class="line" d="M281 364V384H159V402M281 384H402V402"/><rect x="57" y="405" width="203" height="53" class="box"/><text x="158" y="428" text-anchor="middle" class="label">PON 1 → 1:16 splitter</text><text x="158" y="447" text-anchor="middle" class="tiny">16 fiber subscribers*</text><rect x="301" y="405" width="206" height="53" class="box"/><text x="404" y="428" text-anchor="middle" class="label">PON 2 → 1:16 splitter</text><text x="404" y="447" text-anchor="middle" class="tiny">16 fiber subscribers*</text>
<path class="line" d="M158 458V479H281M404 458V479H281V490" marker-end="url(#arrow)"/><rect x="100" y="493" width="363" height="53" class="box"/><text x="281" y="516" text-anchor="middle" class="label">32 managed GPON ONTs*</text><text x="281" y="536" text-anchor="middle" class="small">OMCI + compatible TR-069 profiles</text>
<rect x="649" y="270" width="494" height="299" class="wireless"/><text x="896" y="299" text-anchor="middle" class="heading">WIRELESS-FED BUILDINGS</text>
<rect x="669" y="315" width="219" height="49" class="box"/><text x="777" y="337" text-anchor="middle" class="label">COMFAST bridge A</text><text x="777" y="355" text-anchor="middle" class="tiny">PtP pair · validation needed</text><rect x="905" y="315" width="219" height="49" class="box"/><text x="1014" y="337" text-anchor="middle" class="label">COMFAST bridge B</text><text x="1014" y="355" text-anchor="middle" class="tiny">PtP pair · validation needed</text>
<path class="line" d="M777 364V405M1014 364V405" marker-end="url(#arrow)"/>
<rect x="670" y="410" width="217" height="114" class="box"/><text x="778" y="433" text-anchor="middle" class="label">Building A*</text><text x="778" y="453" text-anchor="middle" class="small">Managed gigabit switch</text><text x="778" y="475" text-anchor="middle" class="small">9 customer CPE routers*</text><text x="778" y="497" text-anchor="middle" class="tiny">Optional shared-area AP</text>
<rect x="906" y="410" width="217" height="114" class="box"/><text x="1015" y="433" text-anchor="middle" class="label">Building B*</text><text x="1015" y="453" text-anchor="middle" class="small">Managed gigabit switch</text><text x="1015" y="475" text-anchor="middle" class="small">9 customer CPE routers*</text><text x="1015" y="497" text-anchor="middle" class="tiny">Optional shared-area AP</text>
<text x="896" y="548" text-anchor="middle" class="small">Wireless backhaul → Ethernet fan-out → home routers</text>
<path class="dash" d="M590 210V230H1122V250M590 230H58V251"/><path class="dash" d="M282 569V590H590M895 569V590H590V609"/>
<rect x="111" y="610" width="958" height="122" class="control"/><text x="590" y="639" text-anchor="middle" class="heading">TeknTandao Control &amp; Intelligence Platform</text>
<text x="590" y="666" text-anchor="middle" class="label">Monitoring  ·  FreeRADIUS  ·  GenieACS  ·  CRM  ·  M-Pesa integration</text><text x="590" y="691" text-anchor="middle" class="small">AI fault correlation · Subscriber planning · Incident management · Technician dispatch</text><text x="590" y="716" text-anchor="middle" class="tiny">Server-side authorization for administrative records; live network actions not yet connected</text>
<rect x="55" y="747" width="128" height="22" class="v"/><text x="119" y="762" text-anchor="middle" class="tiny">Known capability</text><rect x="203" y="747" width="175" height="22" class="assume"/><text x="291" y="762" text-anchor="middle" class="tiny">* Pilot assumption</text><text x="408" y="762" class="tiny">Connectivity, cross-vendor provisioning and radio performance require onsite validation.</text>
</svg>