<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="975" viewBox="0 0 1400 975" role="img" aria-labelledby="title desc">
<title id="title">TeknTandao Hybrid ISP Architecture</title><desc id="desc">Conceptual network with MikroTik core, VSOL fiber GPON access, COMFAST wireless bridges, centralized services and AI operations.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#245ca0"/></marker><marker id="darrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7c55ac"/></marker><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#1d3552}.title{font-size:32px;font-weight:800}.section{font-size:19px;font-weight:800}.heading{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.tiny{font-size:12px}.bold{font-weight:700}.line{fill:none;stroke:#245ca0;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#7c55ac;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#darrow)}.card{fill:#fff;stroke:#bdd0e5;stroke-width:2}.green{fill:#ebfff4;stroke:#48a775;stroke-width:2}.orange{fill:#fff7e9;stroke:#e69b38;stroke-width:2}.blue{fill:#eef6ff;stroke:#6b9dd7;stroke-width:2}.purple{fill:#f5f1ff;stroke:#8d70bb;stroke-width:2}
</style></defs>
<rect width="1400" height="975" rx="20" fill="#f7faff"/>
<text x="700" y="48" class="title" text-anchor="middle">TeknTandao Hybrid ISP Architecture</text><text x="700" y="77" class="body" text-anchor="middle">50-customer planning scenario · Fiber + wireless · AI-assisted operations</text>
<rect x="70" y="112" width="1260" height="140" rx="18" class="blue"/><text x="92" y="143" class="section">01 · Internet / core network</text>
<rect x="285" y="162" width="340" height="65" rx="13" class="card"/><text x="455" y="188" class="heading" text-anchor="middle">Upstream Internet</text><text x="455" y="210" class="small" text-anchor="middle">Wholesale transit · Assumed 200 Mbps</text>
<rect x="790" y="162" width="380" height="65" rx="13" class="green"/><text x="980" y="188" class="heading" text-anchor="middle">MikroTik RB5009</text><text x="980" y="210" class="small" text-anchor="middle">PPPoE · RADIUS · Firewall · VLANs · QoS</text>
<path class="line" d="M625 194 H786"/>
<rect x="70" y="281" width="612" height="333" rx="18" class="blue"/><rect x="718" y="281" width="612" height="333" rx="18" class="green"/>
